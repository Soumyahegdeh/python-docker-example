apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-docker-example
  labels:
    app: python-docker-example
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-docker-example
  template:
    metadata:
      labels:
        app: python-docker-example
    spec:
      containers:
      - name: python-docker-example
        image: soumyahe/python-docker-example:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "production"